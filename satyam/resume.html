<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a print-ready resume from your saved DevPortfolio profile.">
  <title>Resume Printout | DevPortfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="resume.css">
  <script src="resume.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
      Back to assistant

  <main class="resume" id="resume" aria-live="polite">
    <div class="loading">Loading your saved profile…</div>
  </main>

</html>
